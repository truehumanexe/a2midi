[package]
name = "a2midi"
version = "0.1.0"
edition = "2024"
authors=[
    "Charles Jackson"
]


[lib]
# standalone target
crate-type = ["cdylib", "lib"]


[dependencies]
nice-plug = { version = "0.4.0", features = ["assert_process_allocs", "standalone", "tracing-subscriber"] }
atomic_float = "1.1"
rtrb = "0.4.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
egui = { version = "0.37.0", features = ["default_fonts"] }
nice-plug-egui = "0.6.0"
egui_plot = "0.38.0"
lazy-regex = "3.6.2"
realfft = "3.5.1"
